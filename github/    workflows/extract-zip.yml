name: Extract My Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi

          mkdir -p /tmp/project-extract
          unzip -q "$ZIP_FILE" -d /tmp/project-extract

          DIR_COUNT=$(find /tmp/project-extract \
            -mindepth 1 -maxdepth 1 -type d | wc -l)

          FILE_COUNT=$(find /tmp/project-extract \
            -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            SOURCE=$(find /tmp/project-extract \
              -mindepth 1 -maxdepth 1 -type d)
          else
            SOURCE=/tmp/project-extract
          fi

          rsync -a --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$SOURCE/" ./

          rm "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract uploaded project ZIP"
            git push
          fi
