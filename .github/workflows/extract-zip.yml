name: Extract, Test and Commit Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find and extract the uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No ZIP file was found in the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/project-extract"
          mkdir -p "$EXTRACT_DIR"

          python3 - "$ZIP_FILE" "$EXTRACT_DIR" <<'PY'
          import pathlib
          import sys
          import zipfile

          zip_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(zip_path) as archive:
              for item in archive.infolist():
                  relative = pathlib.PurePosixPath(item.filename)

                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe path in ZIP: {item.filename}")

                  if any(part in {".git", "node_modules"} for part in relative.parts):
                      continue

                  if relative.name == ".env" or relative.name.startswith(".env."):
                      continue

                  target = (destination / pathlib.Path(*relative.parts)).resolve()

                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe path in ZIP: {item.filename}")

                  archive.extract(item, destination)
          PY

          mapfile -t TOP_DIRS < <(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t TOP_FILES < <(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type f -print)

          if [[ ${#TOP_DIRS[@]} -eq 1 && ${#TOP_FILES[@]} -eq 0 ]]; then
            SOURCE="${TOP_DIRS[0]}"
          else
            SOURCE="$EXTRACT_DIR"
          fi

          if [[ ! -f "$SOURCE/package.json" || ! -f "$SOURCE/server.js" ]]; then
            echo "ERROR: package.json or server.js is missing."
            find "$EXTRACT_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          cp -a "$SOURCE/." ./

          if [[ -f .github/workflows/ci.yml ]]; then
            sed -i \
              -e 's|actions/checkout@v4|actions/checkout@v7|g' \
              -e 's|actions/setup-node@v4|actions/setup-node@v7|g' \
              .github/workflows/ci.yml
          fi

          rm -- "$ZIP_FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run automated tests
        run: npm test

      - name: Check that the app starts and responds
        shell: bash
        run: |
          set -euo pipefail

          LOG_FILE="$RUNNER_TEMP/cbse-app.log"

          MONITOR_MODE=browser PORT=3000 HOST=127.0.0.1 node server.js > "$LOG_FILE" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          HEALTHY=false

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              HEALTHY=true
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [[ "$HEALTHY" != "true" ]]; then
            echo "ERROR: The app did not become healthy. Server log follows:"
            cat "$LOG_FILE"
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:3000/ -o /dev/null

          echo "Startup check passed: /healthz and homepage both responded."

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract and validate uploaded project ZIP"
            git push
          else
            echo "No file changes to commit."
          fi
